version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oee_sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oee_password}
      POSTGRES_DB: ${POSTGRES_DB:-oee_sentinel}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oee} -d ${POSTGRES_DB:-oee_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oee_net

volumes:
  postgres_data:

networks:
  oee_net:
    driver: bridge